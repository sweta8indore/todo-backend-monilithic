trigger: none

stages:
- stage: Deploy_Production
  displayName: Deploy FastAPI App

  jobs:
  - deployment: DeployFastAPI
    displayName: Deploy on VM

    environment:
      name: dev-backend
      resourceType: VirtualMachine
      resourceName: backend-vm

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # 🔹 Step 1: Copy Code
          - script: |
              echo "Copying project files..."
              mkdir -p ~/fastapi-app
              cp -r $(System.DefaultWorkingDirectory)/* ~/fastapi-app/
            displayName: Copy Code

          # 🔹 Step 2: Install system dependencies (ODBC etc.)
          - script: |
              echo "Installing system dependencies..."

              sudo apt-get update -y
              sudo apt-get install -y curl gnupg2 unixodbc unixodbc-dev python3 python3-venv python3-pip

              # Add Microsoft repo
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg

              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" | \
              sudo tee /etc/apt/sources.list.d/mssql-release.list

              sudo apt-get update -y

              # Install ODBC driver
              sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

            displayName: Install System Dependencies

          # 🔹 Step 3: Setup Python + Install requirements
          - script: |
              echo "Setting up Python environment..."

              cd ~/fastapi-app

              # Fresh venv (avoid corruption)
              rm -rf venv
              python3 -m venv venv

              source venv/bin/activate

              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt

            displayName: Setup Python Environment

          # 🔹 Step 4: Restart FastAPI (via systemd)
          - script: |
              echo "Restarting FastAPI service..."

              if systemctl list-units --type=service | grep -q fastapi; then
                sudo systemctl restart fastapi
                sudo systemctl status fastapi --no-pager
              else
                echo "FastAPI service not found, running manually..."

                # fallback (not recommended for prod)
                nohup ~/fastapi-app/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
              fi

            displayName: Start Application