trigger: none

variables:
- group: database-string

stages:
- stage: Deploy_Production
  displayName: Deploy to Production

  jobs:
  - deployment: DeployFastAPI
    displayName: FastAPI Deployment

    environment:
      name: production-backend
      resourceType: VirtualMachine
      resourceName: backend-vm

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # 🔹 Step 1: Copy code to server folder
          - script: |
              echo "Deploying code..."
              mkdir -p ~/fastapi-app
              cp -r $(System.DefaultWorkingDirectory)/* ~/fastapi-app/
            displayName: Copy Code

          # 🔹 Step 2: Setup venv (only if not exists)
          - script: |
              cd ~/fastapi-app

              if [ ! -d "venv" ]; then
                echo "Creating virtual environment..."
                python3 -m venv venv
              fi

              source venv/bin/activate

              pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Setup Python Environment

          # 🔹 Step 3: Restart FastAPI service
          - script: |
              echo "Restarting FastAPI service..."
              sudo systemctl restart fastapi
              sudo systemctl status fastapi --no-pager
            displayName: Restart Service